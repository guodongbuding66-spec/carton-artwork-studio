name: Deploy staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

# Staging has two deployment paths:
# 1) Cloudflare Workers Builds (native Git integration)
# 2) this GitHub Actions workflow as an independent fallback.
# Both are allowed to deploy only the reviewed staging branch.

concurrency:
  group: carton-artwork-studio-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm run test:migrations
      - name: Check staging fallback configuration
        id: fallback-config
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ vars.CLOUDFLARE_KV_NAMESPACE_ID }}
          CLOUDFLARE_STAGING_URL: ${{ vars.CLOUDFLARE_STAGING_URL }}
        run: |
          missing=()
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing+=("CLOUDFLARE_API_TOKEN")
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing+=("CLOUDFLARE_ACCOUNT_ID")
          [ -n "$CLOUDFLARE_D1_DATABASE_ID" ] || missing+=("CLOUDFLARE_D1_DATABASE_ID")
          [ -n "$CLOUDFLARE_KV_NAMESPACE_ID" ] || missing+=("CLOUDFLARE_KV_NAMESPACE_ID")
          [ -n "$CLOUDFLARE_STAGING_URL" ] || missing+=("CLOUDFLARE_STAGING_URL")

          mkdir -p artifacts
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "missing=" >> "$GITHUB_OUTPUT"
            printf '{"configured":true,"missing":[],"gitSha":"%s","gitRef":"%s"}\n' "$GITHUB_SHA" "$GITHUB_REF" > artifacts/staging-fallback-config.json
          else
            joined="$(IFS=,; echo "${missing[*]}")"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "missing=$joined" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Actions staging deploy fallback is not configured. Missing: $joined"
            MISSING="$joined" node - <<'NODE'
          const fs=require("node:fs");
          const missing=String(process.env.MISSING||"").split(",").filter(Boolean);
          const payload={
            schemaVersion:1,
            configured:false,
            missing,
            gitSha:process.env.GITHUB_SHA||"",
            gitRef:process.env.GITHUB_REF||""
          };
          fs.writeFileSync("artifacts/staging-fallback-config.json",JSON.stringify(payload,null,2)+"\n");
          NODE
          fi
      - name: Generate staging Wrangler config
        if: steps.fallback-config.outputs.configured == 'true'
        run: node scripts/render-wrangler.mjs staging
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ vars.CLOUDFLARE_KV_NAMESPACE_ID }}
          CLOUDFLARE_BOOTSTRAP_ADMIN_EMAIL: ${{ vars.CLOUDFLARE_BOOTSTRAP_ADMIN_EMAIL }}
          CLOUDFLARE_PDFX_VALIDATOR_URL: ${{ vars.CLOUDFLARE_PDFX_VALIDATOR_URL }}
      - name: Apply D1 migrations
        if: steps.fallback-config.outputs.configured == 'true'
        run: npx wrangler d1 migrations apply DB --remote --config .wrangler.staging.generated.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker and assets
        if: steps.fallback-config.outputs.configured == 'true'
        run: npx wrangler deploy --config .wrangler.staging.generated.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Install trusted PDF/X validator secret when configured
        if: steps.fallback-config.outputs.configured == 'true'
        run: |
          if [ -n "$CLOUDFLARE_PDFX_VALIDATOR_URL" ] && [ -n "$CLOUDFLARE_PDFX_VALIDATOR_TOKEN" ]; then
            printf '%s' "$CLOUDFLARE_PDFX_VALIDATOR_TOKEN" | npx wrangler secret put PDFX_VALIDATOR_TOKEN --config .wrangler.staging.generated.json
          else
            echo "Trusted PDF/X validator not configured; Production remains blocked."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PDFX_VALIDATOR_URL: ${{ vars.CLOUDFLARE_PDFX_VALIDATOR_URL }}
          CLOUDFLARE_PDFX_VALIDATOR_TOKEN: ${{ secrets.CLOUDFLARE_PDFX_VALIDATOR_TOKEN }}
      - name: Post-deploy staging smoke test
        if: steps.fallback-config.outputs.configured == 'true'
        run: node scripts/smoke-staging.mjs
        env:
          CLOUDFLARE_STAGING_URL: ${{ vars.CLOUDFLARE_STAGING_URL }}
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
      - name: Record unavailable fallback acceptance state
        if: steps.fallback-config.outputs.configured != 'true'
        env:
          MISSING_FALLBACK_CONFIG: ${{ steps.fallback-config.outputs.missing }}
        run: |
          node - <<'NODE'
          const fs=require("node:fs");
          fs.mkdirSync("artifacts",{recursive:true});
          const missing=String(process.env.MISSING_FALLBACK_CONFIG||"").split(",").filter(Boolean);
          fs.writeFileSync("artifacts/staging-acceptance.json",JSON.stringify({
            schemaVersion:2,
            generatedAt:new Date().toISOString(),
            gitSha:process.env.GITHUB_SHA||"",
            gitRef:process.env.GITHUB_REF||"",
            runtimeHealthVerified:false,
            result:"FALLBACK_NOT_CONFIGURED",
            missingFallbackConfiguration:missing
          },null,2)+"\n");
          NODE
      - name: Upload staging acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-acceptance-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
