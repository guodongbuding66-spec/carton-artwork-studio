name: Deploy staging

on:
  workflow_dispatch:
  push:
    branches:
      - staging

permissions:
  contents: read

concurrency:
  group: carton-artwork-studio-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify staging commit is merged to main
        if: github.event_name == 'push'
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm run test:migrations
      - name: Generate staging Wrangler config
        run: node scripts/render-wrangler.mjs staging
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ vars.CLOUDFLARE_R2_BUCKET_NAME }}
          CLOUDFLARE_BOOTSTRAP_ADMIN_EMAIL: ${{ vars.CLOUDFLARE_BOOTSTRAP_ADMIN_EMAIL }}
          CLOUDFLARE_PDFX_VALIDATOR_URL: ${{ vars.CLOUDFLARE_PDFX_VALIDATOR_URL }}
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --config .wrangler.staging.generated.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker and assets
        run: npx wrangler deploy --config .wrangler.staging.generated.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Install trusted PDF/X validator secret
        run: |
          test -n "$CLOUDFLARE_PDFX_VALIDATOR_TOKEN"
          printf '%s' "$CLOUDFLARE_PDFX_VALIDATOR_TOKEN" | npx wrangler secret put PDFX_VALIDATOR_TOKEN --config .wrangler.staging.generated.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PDFX_VALIDATOR_TOKEN: ${{ secrets.CLOUDFLARE_PDFX_VALIDATOR_TOKEN }}
      - name: Post-deploy staging smoke test
        run: node scripts/smoke-staging.mjs
        env:
          CLOUDFLARE_STAGING_URL: ${{ vars.CLOUDFLARE_STAGING_URL }}
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
      - name: Upload staging acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: staging-acceptance-${{ github.sha }}
          path: artifacts/staging-acceptance.json
          if-no-files-found: error
          retention-days: 30
